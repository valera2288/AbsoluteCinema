<form method="post" class="account-form">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form.visible_fields %}
    <div>{{ field.label_tag }}{{ field }}{{ field.errors }}
      {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    </div>
  {% endfor %}
  {% for field in form.hidden_fields %}{{ field }}{{ field.errors }}{% endfor %}
  <button class="button" type="submit">{{ submit_label|default:"Подтвердить" }}</button>
</form>
